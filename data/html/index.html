<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <style>
body {
    width: 100%;
    padding: 0px;
    margin: 0px;
    background-color: #000;
}

.game-window-render {
    position: fixed;
    z-index: 1000;
}

.ws-status {
    position: fixed;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    z-index: 1000;
}
.ws-status.connecting   { background: #fff3cd; color: #856404; }
.ws-status.connected    { background: #d4edda; color: #155724; }
.ws-status.disconnected { background: #f8d7da; color: #721c24; }

    </style>
</head>
<body>
    <canvas class="game-window-render" width="1000px" height="500px" id="game_window_render"></canvas>
    <div id="ws-status">Connecting…</div>
    <script src="./js/game-server-mmo-api.js?v=1"></script>
    <script src="./js/game-server-mmo-render.js?v=1"></script>
    <script src="./js/index.js?v=1"></script>
</body>
</html>
