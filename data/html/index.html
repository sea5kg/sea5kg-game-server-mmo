<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <style>
body {
    width: 100%;
    padding: 0px;
    margin: 0px;
    background-color: #000;
}

.game-window-render {
    position: fixed;
    z-index: 1000;
}

.ws-status {
    display: table;
    position: fixed;
    width: 100%;
    height: 100%;
    padding: 4px 8px;
    border-radius: 4px;
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.95);
    color: #721c24;
}
.ws-status.connecting {
    color: #ffffff;
}
.ws-status.connected {
    display: none;
}
.ws-status.disconnected {
    color: #dd061b;
}
.ws-status-text {
    height: 100%;
    display: table-cell;
    vertical-align: middle;
}

    </style>
</head>
<body>
    <canvas class="game-window-render" width="1000px" height="500px" id="game_window_render"></canvas>
    <div class="ws-status connecting" id="ws_status">
        <div class="ws-status-text" id="ws_status_text">Connecting...</div>
    </div>
    <script src="./js/game-server-mmo-api.js?v=1"></script>
    <script src="./js/game-server-mmo-render.js?v=1"></script>
    <script src="./js/index.js?v=1"></script>
</body>
</html>
